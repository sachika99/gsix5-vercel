<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSIX5 - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #FFFFFF;
            --green: #78D23D;
            --silver: #CBC8C3;
            --dark-bg: #0A0A0A;
            --card-bg: rgba(255, 255, 255, 0.02);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--white);
            cursor: none;
            position: relative;
        }

        /* Enhanced Custom Cursor */
        .cursor {
            width: 12px;
            height: 12px;
            background: var(--green);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
        }

        .cursor-follower {
            width: 40px;
            height: 40px;
            border: 1px solid var(--green);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.3;
            transform: translate(-50%, -50%);
        }

        /* Crystal Effect Background */
        .crystal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(180deg, #000000 0%, #0A0A0A 50%, #000000 100%);
        }

        /* Sparkling Stars - Layer 1 (Small) */
        .star-layer-1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star-small {
            position: absolute;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
            opacity: 0.8;
        }

        /* Sparkling Stars - Layer 2 (Medium) */
        .star-layer-2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star-medium {
            position: absolute;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            opacity: 0.8;
        }

        /* Sparkling Stars - Layer 3 (Large Accent) */
        .star-layer-3 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star-large {
            position: absolute;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 
                0 0 12px rgba(255, 255, 255, 1),
                0 0 24px rgba(255, 255, 255, 0.6);
            opacity: 0.8;
        }

        /* Random sparkle animations - multiple variations */
        @keyframes sparkle-1 {
            0%, 100% { 
                opacity: 0.7;
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.4);
            }
        }

        @keyframes sparkle-2 {
            0%, 100% { 
                opacity: 0.6;
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @keyframes sparkle-3 {
            0%, 100% { 
                opacity: 0.8;
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.5);
            }
        }

        @keyframes sparkle-4 {
            0%, 100% { 
                opacity: 0.75;
                transform: scale(1);
            }
            30% { 
                opacity: 1;
                transform: scale(1.2);
            }
            60% {
                opacity: 0.85;
                transform: scale(1.1);
            }
        }

        @keyframes sparkle-5 {
            0%, 100% { 
                opacity: 0.65;
                transform: scale(1);
            }
            40% { 
                opacity: 1;
                transform: scale(1.6);
            }
        }

        @keyframes sparkle-6 {
            0%, 100% { 
                opacity: 0.8;
                transform: scale(1);
                filter: brightness(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.7);
                filter: brightness(1.5);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 80px;
        }

        /* Status Badge */
        header {
            position: absolute;
            top: 60px;
            animation: fadeInDown 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-badge {
            padding: 10px 24px;
            border: 1px solid rgba(120, 210, 61, 0.3);
            border-radius: 30px;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--green);
            background: rgba(120, 210, 61, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .status-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(120, 210, 61, 0.2), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Content */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 1400px;
        }

        /* Brand Section */
        .brand-section {
            margin-top: 120px;
            margin-bottom: 80px;
        }

        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(80px, 18vw, 280px);
            font-weight: 700;
            line-height: 0.9;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--white) 0%, var(--green) 50%, var(--white) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            animation: titleGradient 8s ease infinite, slideUpFade 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
            position: relative;
        }

        @keyframes titleGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(60px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .launching-text {
            font-family: 'Inter', sans-serif;
            font-size: clamp(20px, 3vw, 36px);
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: var(--silver);
            animation: fadeInScale 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both;
            position: relative;
            padding-bottom: 25px;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        .launching-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            animation: expandLine 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.8s both;
        }

        @keyframes expandLine {
            to { width: 120px; }
        }

        .motto {
            font-family: 'Inter', sans-serif;
            font-size: clamp(15px, 2vw, 20px);
            font-weight: 300;
            color: rgba(203, 200, 195, 0.7);
            letter-spacing: 0.5px;
            margin-top: 40px;
            margin-bottom: 20px;
            font-style: italic;
            animation: fadeIn 1.5s ease 1.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Countdown Section */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            margin-top: 20px;
        }

        .countdown-item {
            position: relative;
            text-align: center;
            padding: 50px 30px;
            background: var(--card-bg);
            border: 1px solid rgba(120, 210, 61, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            animation: countdownAppear 0.8s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .countdown-item:nth-child(1) { animation-delay: 1.4s; }
        .countdown-item:nth-child(2) { animation-delay: 1.5s; }
        .countdown-item:nth-child(3) { animation-delay: 1.6s; }
        .countdown-item:nth-child(4) { animation-delay: 1.7s; }

        @keyframes countdownAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .countdown-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(120, 210, 61, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .countdown-item:hover {
            background: rgba(120, 210, 61, 0.05);
            border-color: var(--green);
            transform: translateY(-15px);
            box-shadow: 0 20px 60px rgba(120, 210, 61, 0.15);
        }

        .countdown-item:hover::before {
            opacity: 1;
        }

        .countdown-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            transform: scaleX(0);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .countdown-item:hover::after {
            transform: scaleX(1);
        }

        .countdown-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(48px, 6vw, 90px);
            font-weight: 700;
            color: var(--white);
            line-height: 1;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
            letter-spacing: -0.02em;
        }

        .countdown-label {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(203, 200, 195, 0.7);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                padding: 50px 50px;
            }

            .countdown {
                gap: 25px;
            }

            .brand-section {
                margin-top: 80px;
                margin-bottom: 60px;
            }
        }

        @media (max-width: 768px) {
            body {
                cursor: auto;
            }

            .cursor, .cursor-follower {
                display: none;
            }

            .container {
                padding: 40px 30px;
            }

            header {
                top: 30px;
            }

            .launching-text {
                letter-spacing: 6px;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .countdown-item {
                padding: 35px 20px;
            }

            .brand-section {
                margin-top: 60px;
                margin-bottom: 50px;
            }

            .hero-title {
                font-size: 120px;
                font-weight: 800;
                letter-spacing: -0.03em;
                margin-bottom: 30px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .countdown {
                gap: 15px;
            }

            .countdown-item {
                padding: 30px 15px;
            }

            .launching-text {
                letter-spacing: 4px;
            }

            .brand-section {
                margin-top: 40px;
            }

            .hero-title {
                font-size: 100px;
                font-weight: 900;
                letter-spacing: -0.04em;
                margin-bottom: 25px;
                text-shadow: 0 0 40px rgba(120, 210, 61, 0.3);
            }
        }
    </style>
</head>
<body>
    <!-- Custom Cursors -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Crystal Background -->
    <div class="crystal-bg"></div>
    
    <!-- Star Layers (Crystal Effect) -->
    <div class="star-layer-1" id="starLayer1"></div>
    <div class="star-layer-2" id="starLayer2"></div>
    <div class="star-layer-3" id="starLayer3"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="status-badge">In Development</div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Brand Section -->
            <div class="brand-section">
                <h1 class="hero-title">GSIX5</h1>
                <div class="launching-text">Launching Soon</div>
            </div>

            <p class="motto">"Building Tomorrow's Digital Reality"</p>

            <div class="countdown">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">00</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">00</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">00</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">00</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Generate Professional Sparkling Stars (Crystal Effect)
        function generateStars() {
            const starLayer1 = document.getElementById('starLayer1');
            const starLayer2 = document.getElementById('starLayer2');
            const starLayer3 = document.getElementById('starLayer3');
            
            // Clear existing stars
            starLayer1.innerHTML = '';
            starLayer2.innerHTML = '';
            starLayer3.innerHTML = '';
            
            // Calculate number of stars based on screen area
            const screenArea = window.innerWidth * window.innerHeight;
            const baseArea = 1920 * 1080;
            const ratio = screenArea / baseArea;
            
            const smallStarCount = Math.floor(200 * ratio);
            const mediumStarCount = Math.floor(100 * ratio);
            const largeStarCount = Math.floor(40 * ratio);
            
            const sparkleAnimations = ['sparkle-1', 'sparkle-2', 'sparkle-3', 'sparkle-4', 'sparkle-5', 'sparkle-6'];
            
            // Layer 1 - Small stars
            for (let i = 0; i < smallStarCount; i++) {
                const star = document.createElement('div');
                star.className = 'star-small';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 1.5 + 0.5) + 'px';
                star.style.height = star.style.width;
                
                const randomAnimation = sparkleAnimations[Math.floor(Math.random() * sparkleAnimations.length)];
                const randomDuration = (Math.random() * 3 + 2) + 's';
                const randomDelay = Math.random() * 5 + 's';
                
                star.style.animation = `${randomAnimation} ${randomDuration} ease-in-out ${randomDelay} infinite`;
                starLayer1.appendChild(star);
            }

            // Layer 2 - Medium stars
            for (let i = 0; i < mediumStarCount; i++) {
                const star = document.createElement('div');
                star.className = 'star-medium';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1.5) + 'px';
                star.style.height = star.style.width;
                
                const randomAnimation = sparkleAnimations[Math.floor(Math.random() * sparkleAnimations.length)];
                const randomDuration = (Math.random() * 4 + 3) + 's';
                const randomDelay = Math.random() * 6 + 's';
                
                star.style.animation = `${randomAnimation} ${randomDuration} ease-in-out ${randomDelay} infinite`;
                starLayer2.appendChild(star);
            }

            // Layer 3 - Large stars
            for (let i = 0; i < largeStarCount; i++) {
                const star = document.createElement('div');
                star.className = 'star-large';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 3 + 2) + 'px';
                star.style.height = star.style.width;
                
                const randomAnimation = sparkleAnimations[Math.floor(Math.random() * sparkleAnimations.length)];
                const randomDuration = (Math.random() * 5 + 4) + 's';
                const randomDelay = Math.random() * 7 + 's';
                
                star.style.animation = `${randomAnimation} ${randomDuration} ease-in-out ${randomDelay} infinite`;
                starLayer3.appendChild(star);
            }
        }
        
        generateStars();
        
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(generateStars, 500);
        });

        // Enhanced Custom Cursor
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.3;
            cursorY += (mouseY - cursorY) * 0.3;
            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;

            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            cursorFollower.style.left = followerX + 'px';
            cursorFollower.style.top = followerY + 'px';

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Cursor hover effect
        const hoverElements = document.querySelectorAll('.countdown-item, .status-badge');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(2)';
                cursorFollower.style.transform = 'translate(-50%, -50%) scale(1.8)';
                cursorFollower.style.opacity = '0.6';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursorFollower.style.transform = 'translate(-50%, -50%) scale(1)';
                cursorFollower.style.opacity = '0.3';
            });
        });

        // Countdown Timer - Auto set to 1 month from now
        const now = new Date();
        const launchDate = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000));

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Parallax effect for star layers
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX / window.innerWidth - 0.5) * 20;
            const moveY = (e.clientY / window.innerHeight - 0.5) * 20;

            const starLayer1 = document.getElementById('starLayer1');
            const starLayer2 = document.getElementById('starLayer2');
            const starLayer3 = document.getElementById('starLayer3');
            
            if (starLayer1) {
                starLayer1.style.transform = `translate(${moveX * 0.02}px, ${moveY * 0.02}px)`;
            }
            if (starLayer2) {
                starLayer2.style.transform = `translate(${moveX * 0.05}px, ${moveY * 0.05}px)`;
            }
            if (starLayer3) {
                starLayer3.style.transform = `translate(${moveX * 0.08}px, ${moveY * 0.08}px)`;
            }
        });
    </script>
</body>
</html>
