<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSIX5 - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #FFFFFF;
            --green: #01a08a;
            --silver: #CBC8C3;
            --dark-bg: #0A0A0A;
            --card-bg: rgba(255, 255, 255, 0.02);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--white);
            cursor: none;
            position: relative;
        }

        /* Enhanced Custom Cursor */
        .cursor {
            width: 12px;
            height: 12px;
            background: var(--green);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
        }

        .cursor-follower {
            width: 40px;
            height: 40px;
            border: 1px solid var(--green);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.3;
            transform: translate(-50%, -50%);
        }

        /* Sophisticated Background */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(1, 160, 138, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(203, 200, 195, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #000000 0%, #0A0A0A 100%);
        }

        /* Animated Waves Background */
        .wave-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(1, 160, 138, 0.15) 0%, transparent 70%);
            border-radius: 45%;
            animation: wave 15s infinite linear;
        }

        .wave:nth-child(1) {
            top: -50%;
            left: -50%;
            animation-duration: 20s;
            opacity: 0.3;
        }

        .wave:nth-child(2) {
            top: -30%;
            left: -30%;
            animation-duration: 25s;
            animation-delay: -5s;
            opacity: 0.2;
        }

        .wave:nth-child(3) {
            top: -40%;
            left: -40%;
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.25;
        }

        @keyframes wave {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Animated Mesh Gradient */
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
            background: 
                radial-gradient(at 0% 0%, rgba(1, 160, 138, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(203, 200, 195, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(1, 160, 138, 0.06) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(203, 200, 195, 0.05) 0px, transparent 50%);
            animation: meshMove 20s ease-in-out infinite;
        }

        @keyframes meshMove {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(1deg); }
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: var(--green);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1);
            }
        }

        /* Professional Starfield */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: starBlink linear infinite;
        }

        .star.small {
            width: 1px;
            height: 1px;
            box-shadow: 0 0 2px rgba(1, 160, 138, 0.4);
        }

        .star.medium {
            width: 2px;
            height: 2px;
            box-shadow: 0 0 4px rgba(1, 160, 138, 0.6);
        }

        .star.large {
            width: 3px;
            height: 3px;
            box-shadow: 0 0 6px rgba(1, 160, 138, 0.8), 0 0 10px rgba(1, 160, 138, 0.4);
        }

        @keyframes starBlink {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Minimalist Grid */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(1, 160, 138, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(1, 160, 138, 0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: 1;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.5; }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 60px;
        }

        /* Status Badge */
        header {
            position: absolute;
            top: 60px;
            animation: fadeInDown 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-badge {
            padding: 10px 24px;
            border: 1px solid rgba(1, 160, 138, 0.3);
            border-radius: 30px;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--green);
            background: rgba(1, 160, 138, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .status-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(1, 160, 138, 0.2), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Content */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 1400px;
        }

        /* Brand Section */
        .brand-section {
            margin-top: 120px;
            margin-bottom: 70px;
        }

        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(60px, 12vw, 280px);
            font-weight: 700;
            line-height: 0.9;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--white) 0%, var(--green) 50%, var(--white) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            animation: titleGradient 8s ease infinite, slideUpFade 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
            position: relative;
        }

        @keyframes titleGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(60px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .launching-text {
            font-family: 'Inter', sans-serif;
            font-size: clamp(16px, 2vw, 36px);
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--silver);
            animation: fadeInScale 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both;
            position: relative;
            padding-bottom: 20px;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        .launching-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            animation: expandLine 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.8s both;
        }

        @keyframes expandLine {
            to { width: 120px; }
        }

        .motto {
            font-family: 'Inter', sans-serif;
            font-size: clamp(13px, 1.5vw, 20px);
            font-weight: 300;
            color: rgba(203, 200, 195, 0.7);
            letter-spacing: 0.5px;
            margin-top: 25px;
            margin-bottom: 15px;
            font-style: italic;
            animation: fadeIn 1.5s ease 1.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Countdown Section */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            margin-top: 15px;
        }

        .countdown-item {
            position: relative;
            text-align: center;
            padding: 45px 25px;
            background: var(--card-bg);
            border: 1px solid rgba(1, 160, 138, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            animation: countdownAppear 0.8s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .countdown-item:nth-child(1) { animation-delay: 1.4s; }
        .countdown-item:nth-child(2) { animation-delay: 1.5s; }
        .countdown-item:nth-child(3) { animation-delay: 1.6s; }
        .countdown-item:nth-child(4) { animation-delay: 1.7s; }

        @keyframes countdownAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .countdown-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(1, 160, 138, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .countdown-item:hover {
            background: rgba(1, 160, 138, 0.05);
            border-color: var(--green);
            transform: translateY(-15px);
            box-shadow: 0 20px 60px rgba(1, 160, 138, 0.15);
        }

        .countdown-item:hover::before {
            opacity: 1;
        }

        .countdown-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            transform: scaleX(0);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .countdown-item:hover::after {
            transform: scaleX(1);
        }

        .countdown-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(36px, 4.5vw, 90px);
            font-weight: 700;
            color: var(--white);
            line-height: 1;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            letter-spacing: -0.02em;
        }

        .countdown-label {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(203, 200, 195, 0.7);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* Decorative Elements */
        .decoration-line {
            position: absolute;
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            animation: decorationPulse 3s ease-in-out infinite;
        }

        .decoration-line.top {
            top: 40%;
            left: 10%;
            animation-delay: 0s;
        }

        .decoration-line.bottom {
            bottom: 40%;
            right: 10%;
            animation-delay: 1.5s;
        }

        @keyframes decorationPulse {
            0%, 100% { opacity: 0.2; transform: scaleX(1); }
            50% { opacity: 0.6; transform: scaleX(1.5); }
        }

        /* Responsive */
        @media (max-width: 1440px) {
            .hero-title {
                font-size: clamp(55px, 11vw, 160px);
            }

            .launching-text {
                font-size: clamp(15px, 1.8vw, 26px);
                letter-spacing: 7px;
            }

            .countdown {
                max-width: 850px;
                gap: 18px;
            }

            .countdown-item {
                padding: 32px 18px;
            }

            .countdown-number {
                font-size: clamp(34px, 4.2vw, 58px);
            }

            .brand-section {
                margin-top: 80px;
                margin-bottom: 50px;
            }
        }

        @media (max-width: 1280px) {
            .container {
                padding: 40px 50px;
            }

            .hero-title {
                font-size: clamp(50px, 10vw, 140px);
            }

            .launching-text {
                font-size: clamp(14px, 1.7vw, 24px);
                letter-spacing: 6px;
            }

            .countdown {
                max-width: 800px;
                gap: 16px;
            }

            .countdown-item {
                padding: 30px 16px;
            }

            .countdown-number {
                font-size: clamp(32px, 4vw, 52px);
            }

            .brand-section {
                margin-top: 70px;
                margin-bottom: 45px;
            }
        }

        @media (max-width: 1024px) {
            .container {
                padding: 35px 40px;
            }

            .hero-title {
                font-size: clamp(45px, 9vw, 120px);
                margin-bottom: 25px;
            }

            .launching-text {
                font-size: clamp(13px, 1.6vw, 22px);
                letter-spacing: 5px;
            }

            .motto {
                font-size: clamp(12px, 1.4vw, 16px);
                margin-top: 20px;
            }

            .countdown {
                gap: 15px;
                max-width: 700px;
            }

            .countdown-item {
                padding: 28px 15px;
            }

            .countdown-number {
                font-size: clamp(30px, 3.8vw, 48px);
                margin-bottom: 10px;
            }

            .countdown-label {
                font-size: 10px;
                letter-spacing: 2px;
            }

            .brand-section {
                margin-top: 60px;
                margin-bottom: 40px;
            }
        }

        @media (max-width: 900px) {
            .container {
                padding: 45px 40px;
            }

            .hero-title {
                font-size: clamp(45px, 11vw, 120px);
            }

            .launching-text {
                letter-spacing: 7px;
            }

            .countdown {
                gap: 18px;
            }

            .countdown-item {
                padding: 35px 18px;
            }

            .brand-section {
                margin-top: 70px;
            }
        }

        @media (max-width: 768px) {
            body {
                cursor: auto;
            }

            .cursor, .cursor-follower {
                display: none;
            }

            .container {
                padding: 40px 30px;
            }

            header {
                top: 30px;
            }

            .hero-title {
                font-size: clamp(40px, 10vw, 100px);
                margin-bottom: 25px;
            }

            .launching-text {
                font-size: clamp(14px, 2vw, 24px);
                letter-spacing: 6px;
                padding-bottom: 20px;
            }

            .motto {
                font-size: 14px;
                margin-top: 25px;
                margin-bottom: 15px;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
                max-width: 100%;
            }

            .countdown-item {
                padding: 32px 18px;
            }

            .countdown-number {
                font-size: clamp(32px, 8vw, 50px);
                margin-bottom: 12px;
            }

            .countdown-label {
                font-size: 10px;
                letter-spacing: 2px;
            }

            .brand-section {
                margin-top: 60px;
                margin-bottom: 50px;
            }

            .decoration-line {
                display: none;
            }

            .status-badge {
                font-size: 10px;
                letter-spacing: 2.5px;
                padding: 9px 20px;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 35px 25px;
            }

            .hero-title {
                font-size: clamp(35px, 9vw, 80px);
            }

            .launching-text {
                letter-spacing: 5px;
            }

            .countdown {
                gap: 15px;
            }

            .countdown-item {
                padding: 28px 15px;
            }

            .brand-section {
                margin-top: 50px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .hero-title {
                font-size: clamp(30px, 8vw, 65px);
                margin-bottom: 20px;
            }

            .launching-text {
                font-size: clamp(12px, 1.8vw, 20px);
                letter-spacing: 4px;
                padding-bottom: 15px;
            }

            .motto {
                font-size: 12px;
                margin-top: 20px;
                margin-bottom: 12px;
            }

            .countdown {
                gap: 12px;
            }

            .countdown-item {
                padding: 25px 12px;
                border-radius: 15px;
            }

            .countdown-number {
                font-size: clamp(28px, 7vw, 42px);
                margin-bottom: 10px;
            }

            .countdown-label {
                font-size: 9px;
                letter-spacing: 1.5px;
            }

            .brand-section {
                margin-top: 40px;
                margin-bottom: 40px;
            }

            .status-badge {
                font-size: 9px;
                letter-spacing: 2px;
                padding: 8px 18px;
            }

            header {
                top: 25px;
            }
        }

        @media (max-width: 375px) {
            .container {
                padding: 25px 15px;
            }

            .hero-title {
                font-size: clamp(26px, 7.5vw, 55px);
            }

            .launching-text {
                letter-spacing: 3px;
            }

            .countdown {
                gap: 10px;
            }

            .countdown-item {
                padding: 22px 10px;
            }

            .countdown-number {
                font-size: clamp(24px, 6.5vw, 38px);
            }

            .brand-section {
                margin-top: 35px;
                margin-bottom: 35px;
            }
        }

        @media (max-width: 320px) {
            .hero-title {
                font-size: clamp(22px, 7vw, 50px);
            }

            .countdown-item {
                padding: 20px 8px;
            }

            .countdown-number {
                font-size: clamp(22px, 6vw, 35px);
            }

            .countdown-label {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Cursors -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Background Layers -->
    <div class="wave-bg">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    <div class="space-bg"></div>
    <div class="mesh-gradient"></div>
    
    <!-- Starfield Effect -->
    <div class="starfield" id="starfield"></div>
    
    <div class="particles" id="particles"></div>
    <div class="grid-overlay"></div>

    <!-- Decorative Lines -->
    <div class="decoration-line top"></div>
    <div class="decoration-line bottom"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="status-badge">In Development</div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Brand Section -->
            <div class="brand-section">
                <h1 class="hero-title">GSIX5</h1>
                <div class="launching-text">Launching Soon</div>
            </div>

            <p class="motto">"Building Tomorrow's Digital Reality"</p>

            <div class="countdown">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">00</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">00</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">00</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">00</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Generate Professional Starfield
        const starfield = document.getElementById('starfield');
        const starCount = 200;
        
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Random size distribution (more small stars, fewer large ones)
            const rand = Math.random();
            if (rand > 0.95) {
                star.classList.add('large');
            } else if (rand > 0.8) {
                star.classList.add('medium');
            } else {
                star.classList.add('small');
            }
            
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = Math.random() * 3 + 's';
            starfield.appendChild(star);
        }

        // Generate Floating Particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.width = Math.random() * 3 + 1 + 'px';
            particle.style.height = particle.style.width;
            particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(particle);
        }

        // Enhanced Custom Cursor
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            // Smooth cursor movement
            cursorX += (mouseX - cursorX) * 0.3;
            cursorY += (mouseY - cursorY) * 0.3;
            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;

            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            cursorFollower.style.left = followerX + 'px';
            cursorFollower.style.top = followerY + 'px';

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Cursor hover effect
        const hoverElements = document.querySelectorAll('.countdown-item, .status-badge');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(2)';
                cursorFollower.style.transform = 'translate(-50%, -50%) scale(1.8)';
                cursorFollower.style.opacity = '0.6';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursorFollower.style.transform = 'translate(-50%, -50%) scale(1)';
                cursorFollower.style.opacity = '0.3';
            });
        });

        // Countdown Timer - Auto set to 1 month from now
        const now = new Date();
        const launchDate = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000));

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX / window.innerWidth - 0.5) * 20;
            const moveY = (e.clientY / window.innerHeight - 0.5) * 20;
            
            document.querySelector('.mesh-gradient').style.transform = 
                `translate(${moveX}px, ${moveY}px) scale(1.1)`;
            
            document.querySelectorAll('.decoration-line').forEach((line, index) => {
                const speed = (index + 1) * 5;
                line.style.transform = `translateX(${moveX / speed}px)`;
            });
        });
    </script>
</body>
</html>
